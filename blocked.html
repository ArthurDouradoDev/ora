<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ora - Bloqueado</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="styles/base/variables.css">
    <link rel="stylesheet" href="styles/components/buttons.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #eebb55;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: url('https://images.unsplash.com/photo-1519681393798-3828fbdb4fc4?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }

        .icon {
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .reason-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .badge-always {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .badge-limit {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .badge-time {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-continue {
            background: rgba(238, 187, 85, 0.12);
            border: 1px solid rgba(238, 187, 85, 0.25);
            color: #eebb55;
            margin-right: 10px;
        }

        .btn-continue:hover {
            background: rgba(238, 187, 85, 0.2);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .access-info {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
        }

        .access-info strong {
            color: rgba(255, 255, 255, 0.8);
        }

        .usage-bar-container {
            max-width: 300px;
            margin: 0 auto 20px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .usage-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
            background: #4ade80;
        }

        .usage-bar-fill.warning { background: #fbbf24; }
        .usage-bar-fill.danger { background: #f87171; }

        .session-note {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 12px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Hidden initially, shown by JS */
        #limited-section { display: none; }
        #always-section { display: none; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="icon"><i class="ph ph-shield-check"></i></div>
        <h1>Mantenha o Foco</h1>

        <!-- Always Blocked view -->
        <div id="always-section">
            <div class="reason-badge badge-always">
                <i class="ph ph-prohibit"></i>
                <span>Site sempre bloqueado</span>
            </div>
            <p>"A disciplina é a mãe do êxito."<br>Este site está bloqueado para o seu bem.</p>
            <a href="ora.html" class="btn"><i class="ph ph-arrow-left"></i> Voltar para o Ora</a>
        </div>

        <!-- Limited — Under Limit (can continue) -->
        <div id="limited-section">
            <div class="reason-badge badge-limit" id="limit-badge">
                <i class="ph ph-warning"></i>
                <span id="limit-badge-text">Acesso limitado</span>
            </div>
            <div class="access-info" id="access-info"></div>
            <div class="usage-bar-container" id="usage-bar-container">
                <div class="usage-bar-fill" id="usage-bar-fill"></div>
            </div>
            <p id="limited-message">Você deseja continuar para este site?</p>
            <div class="btn-group">
                <button class="btn btn-continue" id="continue-btn"><i class="ph ph-arrow-right"></i> Continuar</button>
                <a href="ora.html" class="btn"><i class="ph ph-arrow-left"></i> Voltar</a>
            </div>
            <div class="session-note" id="session-note"></div>
        </div>

        <!-- Limited — Over Limit (blocked) -->
        <div id="overlimit-section" style="display: none;">
            <div class="reason-badge badge-time" id="overlimit-badge">
                <i class="ph ph-hourglass"></i>
                <span id="overlimit-badge-text">Limite excedido</span>
            </div>
            <p id="overlimit-message">Você atingiu o limite para este site hoje.</p>
            <a href="ora.html" class="btn"><i class="ph ph-arrow-left"></i> Voltar para o Ora</a>
        </div>
    </div>

    <script src="scripts/blocked.js"></script>
</body>
</html>
