<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site em pausa — Ora</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="styles/base/reset.css">
    <link rel="stylesheet" href="styles/base/fonts.css">
    <link rel="stylesheet" href="styles/base/variables.css">
    <link rel="stylesheet" href="styles/components/ui.css">
    <link rel="stylesheet" href="styles/modules/protecao.css">
    <link rel="icon" href="assets/icon.png">
    <style>
        body.block-page {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            color: var(--text);
            font-family: var(--f-ui);
            position: relative;
            overflow-x: hidden;
        }
        .block-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(12, 10, 8, 0.72);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            z-index: 0;
        }
        .protecao-block-card {
            z-index: 1;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        }
        .protecao-block-card h1 {
            font-size: 1.625rem;
            font-weight: 600;
            margin: 0;
        }
    </style>
</head>
<body class="block-page">
    <div class="block-backdrop" aria-hidden="true"></div>

    <main class="protecao-block-card surface-solid" role="main" aria-labelledby="blkTitle">
        <span class="protecao-site-badge">
            <span class="fav" id="blkFav" aria-hidden="true">O</span>
            <span id="blkSite">site</span>
        </span>

        <div class="stack" style="--gap:0.375rem">
            <p class="label" id="blkKicker">Em foco</p>
            <h1 id="blkTitle">Você está em foco</h1>
            <p class="why" id="blkWhy"></p>
        </div>

        <p class="until" id="blkUntil"></p>

        <div class="stack" style="--gap:0.5rem" id="blkActions">
            <a class="btn btn-primary btn-lg btn-block" id="blkPrimary" href="ora.html#hoje">Voltar para a tarefa</a>
            <button type="button" class="btn btn-quiet" id="blkTemp" hidden>Acessar por 5 minutos</button>
            <a class="btn btn-quiet btn-sm" id="blocked-respiro" href="ora.html#rezar/respiro">
                <i class="ph ph-wind" aria-hidden="true"></i>
                <span id="blkRespiroText">Fazer um respiro</span>
            </a>
        </div>

        <div class="temp-box" id="blkTempBox" hidden>
            <b id="tempTitle"></b>
            <p class="meta" id="tempNote" style="margin:0;line-height:1.5"></p>
            <label class="field">
                <span id="tempReasonLabel">Para quê? (opcional — fica só neste computador)</span>
                <input class="input" id="tempReasonInput" autocomplete="off" placeholder="Ex.: responder uma mensagem específica">
            </label>
            <div class="row wrap">
                <a class="btn btn-primary" id="tempBackBtn" href="ora.html#hoje">Voltar para a tarefa</a>
                <button type="button" class="btn btn-aux" id="openTemp">Abrir por 5 min</button>
            </div>
        </div>
    </main>

    <script src="scripts/shared/blocker-core.js"></script>
    <script src="scripts/blocked.js"></script>
</body>
</html>
