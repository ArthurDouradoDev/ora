<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ora — Testes</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #16161a; color: #eee; padding: 32px; max-width: 880px; margin: 0 auto; }
        h1 { font-size: 1.3rem; }
        #summary { font-size: 1.05rem; font-weight: 600; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; }
        #summary.ok { background: rgba(74, 222, 128, 0.12); color: #4ade80; }
        #summary.fail { background: rgba(248, 113, 113, 0.12); color: #f87171; }
        .group { margin-bottom: 18px; }
        .group h2 { font-size: 0.95rem; color: #eebb55; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .test { padding: 4px 8px; font-size: 0.85rem; border-radius: 6px; }
        .test.pass { color: #9ae6b4; }
        .test.fail { color: #f87171; background: rgba(248, 113, 113, 0.08); font-weight: 600; }
        .test .detail { color: #999; font-weight: 400; display: block; margin-left: 22px; }
    </style>
</head>
<body>
    <h1>Ora — Suite de Testes (funções puras)</h1>
    <p style="color:#888; font-size:0.82rem;">Abra este arquivo direto no navegador. Nenhuma API de extensão é necessária — apenas funções puras dos módulos compartilhados são testadas.</p>
    <div id="summary"></div>
    <div id="results"></div>

    <script src="../scripts/shared/blocker-core.js"></script>
    <script src="../scripts/shared/pomodoro-core.js"></script>
    <script src="../scripts/shared/route-core.js"></script>
    <script src="../scripts/shared/tasks-core.js"></script>
    <script src="../scripts/shared/sessions-core.js"></script>
    <script src="../scripts/shared/counter-core.js"></script>
    <script src="../scripts/shared/onboarding-core.js"></script>
    <script src="../scripts/shared/migrate-core.js"></script>
    <script src="../scripts/shared/today-core.js"></script>
    <script src="../scripts/shared/sound-core.js"></script>
    <script src="../scripts/shared/reminders-core.js"></script>
    <script src="../scripts/shared/search-core.js"></script>
    <script src="../scripts/shared/reader-core.js"></script>
    <script src="../scripts/shared/rosary-core.js"></script>
    <script src="../scripts/shared/settings-core.js"></script>
    <script src="../scripts/shared/liturgy-core.js"></script>
    <script src="../scripts/shared/saints-core.js"></script>
    <script src="../scripts/shared/bible-core.js"></script>
    <script src="../scripts/shared/frutos-core.js"></script>
    <script src="../scripts/shared/rituals-core.js"></script>
    <script src="../scripts/shared/screentime-core.js"></script>
    <script src="../scripts/shared/liturgical-calendar.js"></script>
    <script src="../scripts/shared/seasons-core.js"></script>
    <script src="../scripts/modules/sync.js"></script>
    <script>
        // Fixtures em JSON, carregadas por fetch. Em file:// o fetch falha e os
        // testes que dependem delas aparecem como ignorados (use node tests/run.js).
        window.__oraFixtures = {};
        Promise.all(['storage-1.1.5'].map(name =>
            fetch('fixtures/' + name + '.json')
                .then(r => (r.ok ? r.json() : null))
                .then(json => { if (json) window.__oraFixtures[name] = json; })
                .catch(() => {})
        )).then(() => {
            const script = document.createElement('script');
            script.src = 'tests.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
